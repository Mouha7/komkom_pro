# Traefik static configuration (development)
# Dev should not request Let's Encrypt certificates for localhost domains.

# Global options
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Entrypoints
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https

  websecure:
    address: :443
    http:
      tls: {}

# Providers
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
  
  # For advanced routing configs (optional)
  file:
    directory: /etc/traefik/configurations
    watch: true

# API Dashboard (dev only)
api:
  insecure: true
  dashboard: true

# Logging
log:
  level: INFO

accessLog: true
