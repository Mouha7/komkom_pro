services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - backend_net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASSWORD_HASH}"
      - "traefik.http.middlewares.dashboard-redirect.redirectregex.regex=^https?://([^/]+)/dashboard$$"
      - "traefik.http.middlewares.dashboard-redirect.redirectregex.replacement=https://$${1}/dashboard/"
      - "traefik.http.middlewares.dashboard-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${ADDRESS_HOST}`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-redirect,dashboard-auth"
      - "traefik.http.routers.traefik-api.rule=Host(`${ADDRESS_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.traefik-api.service=api@internal"
      - "traefik.http.routers.traefik-api.entrypoints=websecure"
      - "traefik.http.routers.traefik-api.tls=true"
      - "traefik.http.routers.traefik-api.middlewares=dashboard-auth"

  postgres_app:
    image: postgres:16-alpine
    container_name: postgres_app
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped

  custom_service:
    build: ./custom_service
    container_name: custom_service
    depends_on:
      - postgres_app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres_app:5432/${POSTGRES_APP_DB}
    expose:
      - "8001"
    networks:
      - backend_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.custom.rule=Host(`${ADDRESS_HOST}`) && PathPrefix(`/custom`)"
      - "traefik.http.routers.custom.entrypoints=websecure"
      - "traefik.http.routers.custom.tls=true"

  dolibarr_db:
    image: mariadb:10.5
    container_name: dolibarr_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DOLI_DB_ROOT_PASS}
      MYSQL_DATABASE: ${DOLI_DB_NAME}
      MYSQL_USER: ${DOLI_DB_USER}
      MYSQL_PASSWORD: ${DOLI_DB_PASS}
      TZ: UTC
    volumes:
      - dolibarr_db_data:/var/lib/mysql
    networks:
      - backend_net
    restart: unless-stopped

  dolibarr:
    image: tuxgasy/dolibarr:latest
    container_name: dolibarr
    depends_on:
      - dolibarr_db
    environment:
      DOLI_DB_HOST: dolibarr_db
      DOLI_DB_USER: ${DOLI_DB_USER}
      DOLI_DB_PASSWORD: ${DOLI_DB_PASS}
      DOLI_DB_NAME: ${DOLI_DB_NAME}
      # Optionnel : pour installation auto
      DOLI_INSTALL_AUTO: "1"
    volumes:
      - dolibarr_html:/var/www/html
      - dolibarr_docs:/var/www/documents
    networks:
      - backend_net
    # Ne pas exposer directement en prod
    ports:
      - "8080:80"

  dolibarr_service:
    build: ./dolibarr_service
    container_name: dolibarr_service
    depends_on:
      - dolibarr
    environment:
      - DOLIBARR_API_URL=http://dolibarr:80/api/index.php
      - DOLIBARR_API_KEY=${DOLI_API_KEY}
    expose:
      - "8002"
    networks:
      - backend_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dolibarrapi.rule=Host(`${ADDRESS_HOST}`) && PathPrefix(`/dolibarr`)"
      - "traefik.http.routers.dolibarrapi.entrypoints=websecure"
      - "traefik.http.routers.dolibarrapi.tls=true"

  keycloak_db:
    image: postgres:16-alpine
    container_name: keycloak_db
    environment:
      POSTGRES_DB: ${KEYC_DB}
      POSTGRES_USER: ${KEYC_USER}
      POSTGRES_PASSWORD: ${KEYC_PASS}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    depends_on:
      - keycloak_db
    environment:
      - KEYCLOAK_ADMIN=${KEYC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYC_ADMIN_PASS}
      - DB_VENDOR=postgres
      - DB_ADDR=keycloak_db
      - DB_DATABASE=${KEYC_DB}
      - DB_USER=${KEYC_USER}
      - DB_PASSWORD=${KEYC_PASS}
    command: ["start-dev"]
    expose:
      - "8080"
    networks:
      - backend_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`${ADDRESS_HOST}`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=websecure"
      - "traefik.http.routers.auth.tls=true"

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    restart: unless-stopped

  mimio:
    image: alpine:latest
    container_name: mimio_storage
    command: ["tail", "-f", "/dev/null"]  # conteneur vide pour héberger les volumes
    volumes:
      - mimio_images:/mimio_images
    networks:
      - backend_net
    restart: unless-stopped

networks:
  backend_net:
    driver: bridge

volumes:
  postgres_app_data:
  dolibarr_db_data:
  dolibarr_html:
  dolibarr_docs:
  keycloak_db_data:
  redis_data:
  mimio_images: