services:
  postgres_app:
    volumes:
      - ./data/postgres_app:/var/lib/postgresql/data

  dolibarr_db:
    volumes:
      - ./data/dolibarr_db:/var/lib/mysql

  redis:
    volumes:
      - ./data/redis:/data

  mimio:
    volumes:
      - ./data/mimio_images:/mimio_images

  dolibarr:
    volumes:
      - ./data/dolibarr_html:/var/www/html
      - ./data/dolibarr_docs:/var/www/documents
